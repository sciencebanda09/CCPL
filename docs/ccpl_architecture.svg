<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">CCPL architecture</title>
  <desc id="desc">Environment transitions pass through delay modeling, consequence attribution, separate reward and safety critics, and a CCPL policy. Audit outputs record alignment and evaluation evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#334155"/></marker>
    <style>.box{stroke:#334155;stroke-width:2}.label{font:600 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#475569;text-anchor:middle}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}</style>
  </defs>
  <rect width="1200" height="560" fill="#fff"/><text x="600" y="38" class="label" font-size="25">Causal Consequence-Penalized Learning (CCPL)</text>
  <rect x="35" y="215" width="145" height="70" rx="12" class="box" fill="#e0f2fe"/><text x="107" y="245" class="label">Environment</text><text x="107" y="268" class="small">state sₜ</text>
  <rect x="230" y="215" width="180" height="70" rx="12" class="box" fill="#e0f2fe"/><text x="320" y="245" class="label">Delayed transition</text><text x="320" y="268" class="small">rₜ, cₜ₊τ, history</text>
  <rect x="485" y="92" width="175" height="70" rx="12" class="box" fill="#fee2e2"/><text x="572" y="122" class="label">Delay model</text><text x="572" y="145" class="small">p(τ | hₜ)</text>
  <rect x="485" y="215" width="175" height="70" rx="12" class="box" fill="#dcfce7"/><text x="572" y="245" class="label">Consequence Net</text><text x="572" y="268" class="small">interventional attribution</text>
  <rect x="485" y="338" width="175" height="70" rx="12" class="box" fill="#dbeafe"/><text x="572" y="368" class="label">Reward critic</text><text x="572" y="391" class="small">Qᵣ</text>
  <rect x="720" y="338" width="175" height="70" rx="12" class="box" fill="#fee2e2"/><text x="807" y="368" class="label">Safety critic</text><text x="807" y="391" class="small">Q꜀</text>
  <rect x="720" y="92" width="175" height="70" rx="12" class="box" fill="#fee2e2"/><text x="807" y="122" class="label">State multiplier</text><text x="807" y="145" class="small">λ(s)</text>
  <rect x="950" y="215" width="200" height="70" rx="12" class="box" fill="#e0f2fe"/><text x="1050" y="245" class="label">CCPL policy</text><text x="1050" y="268" class="small">π(a | s)</text>
  <rect x="950" y="420" width="200" height="70" rx="12" class="box" fill="#dcfce7"/><text x="1050" y="450" class="label">Audit &amp; evaluation</text><text x="1050" y="473" class="small">alignment · support · hashes</text>
  <path d="M180 250 H230 M410 235 L485 140 M410 250 H485 M410 270 L485 360 M660 127 H720 M660 250 H950 M660 373 H720 M895 127 L950 225 M895 373 L950 275" class="arrow"/>
  <path d="M950 275 C820 320 480 485 180 285" class="arrow"/><path d="M410 285 C650 490 850 490 950 455 M1050 285 V420" class="arrow dash"/>
</svg>
