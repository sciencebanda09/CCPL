[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpl-safety-audit"
version = "0.1.0"
description = "Stress-test reports for CCPL constrained reinforcement learning checkpoints"
requires-python = ">=3.10"
dependencies = ["ccpl-rl>=0.7.7", "numpy>=1.24"]

[project.scripts]
safety-audit = "safety_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["safety_audit", "safety_audit.*"]
