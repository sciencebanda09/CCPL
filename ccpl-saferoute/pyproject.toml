[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpl-saferoute"
version = "0.1.0"
description = "A visual delayed-risk warehouse environment powered by CCPL"
requires-python = ">=3.10"
dependencies = [
  "ccpl-rl>=0.7.1",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
saferoute = "saferoute.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
